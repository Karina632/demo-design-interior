<!DOCTYPE html>
<html lang="ro">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Velo Interior</title>

    <link rel="stylesheet" href="./css/global.css">
<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" href="./css/media.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>
    <div class="loader">

    <div class="loader-logo">

        <span class="loader-top">Velo</span>

        <span class="loader-bottom">INTERIOR</span>

    </div>

</div>

<div id="header-placeholder"></div>

    <main>

        <section class="hero">

            <div class="hero-overlay-left"></div>

            <div class="hero-overlay-bottom"></div>

            <div class="hero-content">

                <h1>
                    Modelăm vise<br>
                    în spații reale
                </h1>

                <a href="#"
                   class="hero-button">

                    Contact

                </a>

            </div>

            <div class="hero-features-wrapper">

    <div class="hero-features">

        <div class="feature-card">

            <div class="feature-icon">
                <i class="fa-regular fa-eye"></i>
            </div>

            <h3>Viziune</h3>

            <div class="feature-line"></div>

            <p>
                Transformăm ideile în spații autentice.
            </p>

        </div>

        <div class="feature-card">

            <div class="feature-icon">
                <i class="fa-regular fa-handshake"></i>
            </div>

            <h3>Implicare</h3>

            <div class="feature-line"></div>

            <p>
                Suntem prezenți în fiecare etapă.
            </p>

        </div>

        <div class="feature-card">

            <div class="feature-icon">
                <i class="fa-regular fa-face-smile"></i>
            </div>

            <h3>Bucurie</h3>

            <div class="feature-line"></div>

            <p>
                Creăm experiene care inspiră.
            </p>

        </div>

        <div class="feature-card">

            <div class="feature-icon">
                <i class="fa-regular fa-heart"></i>
            </div>

            <h3>Empatie</h3>

            <div class="feature-line"></div>

            <p>
                Punem oamenii în centrul fiecărui proiect.
            </p>

        </div>

    </div>

</div>

        </section>

  

    </main>

    <script src="./js/main.js"></script>
<script src="./js/script.js"></script>

</body>

</html>
